<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞品分析周报系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
.header{background:linear-gradient(135deg,#0284c7,#0ea5e9,#38bdf8);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(14,165,233,.3)}
.header h1{color:#fff;font-size:22px;font-weight:700;letter-spacing:.5px}
.btn-primary{background:#fff;color:#0ea5e9;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.view{display:none;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:transform .2s;cursor:pointer;border:2px solid transparent}
.stat-card:hover{transform:translateY(-2px);border-color:#0ea5e9;box-shadow:0 4px 16px rgba(14,165,233,.12)}
.stat-label{font-size:13px;color:#64748b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-value{font-size:28px;font-weight:700;color:#0f172a}
.stat-value .unit{font-size:14px;font-weight:400;color:#94a3b8;margin-left:2px}
.stat-card .go-icon{color:#0ea5e9;font-size:16px;opacity:0;transition:opacity .2s}
.stat-card:hover .go-icon{opacity:1}
.competitor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px}
.competitor-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .25s;border:2px solid transparent}
.competitor-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(14,165,233,.12);border-color:#0ea5e9}
.competitor-card .card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.competitor-card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.competitor-card .name{font-size:16px;font-weight:600}
.competitor-card .review-count{font-size:12px;color:#94a3b8;margin-top:2px}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .6s ease}
.section-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:#0ea5e9;border-radius:2px}
.weekly-overview{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px}
.chart-container{height:200px;margin-bottom:20px}
.pain-points-list{display:flex;flex-direction:column;gap:10px}
.pain-point-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-radius:10px;font-size:14px}
.severity{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;color:#fff}
.severity.high{background:#ef4444}
.severity.medium{background:#f97316}
.severity.low{background:#eab308}
.reports-list{display:flex;flex-direction:column;gap:12px}
.report-item{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
.report-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(14,165,233,.1)}
.report-item .report-info .report-date{font-size:15px;font-weight:600;margin-bottom:4px}
.report-item .report-info .report-summary{font-size:13px;color:#64748b}
.report-item .arrow{color:#94a3b8;font-size:18px}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#0ea5e9;font-size:15px;font-weight:600;cursor:pointer;padding:8px 0;margin-bottom:16px;transition:gap .2s}
.back-btn:hover{gap:10px}
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.detail-header .icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.detail-header .name{font-size:24px;font-weight:700}
.detail-header .review-count{font-size:14px;color:#64748b;margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.detail-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.detail-card.full-width{grid-column:1/-1}
.pie-chart-container{height:220px;display:flex;align-items:center;justify-content:center}
.pain-list{display:flex;flex-direction:column;gap:8px}
.pain-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;font-size:14px}
.feature-list{display:flex;flex-direction:column;gap:8px}
.feature-item{padding:10px 14px;background:#f8fafc;border-radius:10px;font-size:14px}
.feature-item .feat-name{font-weight:600;margin-bottom:2px}
.feature-item .feat-ver{font-size:12px;color:#64748b}
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{padding:14px;background:#f8fafc;border-radius:10px}
.review-item .review-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.review-item .stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
.review-item .sentiment{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;color:#fff}
.sentiment.positive{background:#22c55e}
.sentiment.neutral{background:#94a3b8}
.sentiment.negative{background:#ef4444}
.review-item .review-text{font-size:13px;color:#475569;line-height:1.5;margin-bottom:6px}
.review-item .review-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:#94a3b8}
.review-item .review-meta svg{width:12px;height:12px;vertical-align:middle}
.report-detail-content{background:#fff;border-radius:16px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px}
.report-detail-content h2{font-size:20px;margin-bottom:16px;color:#0f172a}
.report-detail-content h3{font-size:16px;margin:16px 0 10px;color:#1e293b}
.report-detail-content p{font-size:14px;line-height:1.8;color:#475569;margin-bottom:10px}
.report-detail-content ul{padding-left:20px;margin-bottom:10px}
.report-detail-content li{font-size:14px;line-height:1.8;color:#475569}
.report-actions{display:flex;gap:12px;margin-bottom:24px}
.btn-action{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.btn-copy{background:#0ea5e9;color:#fff}
.btn-copy:hover{background:#0284c7}
.btn-download{background:#fff;color:#0ea5e9;border:2px solid #0ea5e9}
.btn-download:hover{background:#f0f9ff}
.toast{position:fixed;top:80px;right:20px;background:#22c55e;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(34,197,94,.3);z-index:1000;transform:translateX(120%);transition:transform .3s ease}
.toast.show{transform:translateX(0)}
.list-page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.list-page-header h2{font-size:20px;font-weight:700}
.list-page-header .count{font-size:14px;color:#64748b}
.data-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.data-table thead th{background:#f8fafc;padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:#64748b;border-bottom:1px solid #e2e8f0}
.data-table tbody td{padding:12px 16px;font-size:14px;border-bottom:1px solid #f1f5f9;color:#334155}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:#f8fafc}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px}
.pagination button{min-width:36px;height:36px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;color:#334155}
.pagination button:hover{border-color:#0ea5e9;color:#0ea5e9}
.pagination button.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:#64748b;margin:0 8px}
.review-card-list{display:flex;flex-direction:column;gap:12px}
.review-card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.review-card .rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.review-card .rc-app{font-size:13px;color:#0ea5e9;font-weight:600}
.review-card .rc-stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
.review-card .rc-text{font-size:14px;color:#334155;line-height:1.6;margin-bottom:8px}
.review-card .rc-meta{display:flex;align-items:center;gap:16px;font-size:12px;color:#94a3b8}
.report-card-list{display:flex;flex-direction:column;gap:12px}
.report-card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.report-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(14,165,233,.1)}
.report-card .rc-period{font-size:15px;font-weight:600;margin-bottom:4px}
.report-card .rc-summary{font-size:13px;color:#64748b}
.pain-card-list{display:flex;flex-direction:column;gap:12px}
.pain-card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pain-card .pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pain-card .pc-app{font-size:13px;color:#0ea5e9;font-weight:600}
.pain-card .pc-text{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:6px}
.pain-card .pc-desc{font-size:13px;color:#64748b;line-height:1.5;margin-bottom:8px}
.pain-card .pc-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:#94a3b8}
.insight-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.insight-card h3{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.insight-card h3::before{content:'';width:4px;height:20px;border-radius:2px}
.insight-card.dynamics h3::before{background:#0ea5e9}
.insight-card.opportunity h3::before{background:#f97316}
.insight-item{padding:12px 14px;background:#f8fafc;border-radius:10px;margin-bottom:8px;font-size:14px;line-height:1.6;color:#334155}
.insight-item:last-child{margin-bottom:0}
.insight-item .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-right:6px;color:#fff}
.insight-item .tag.blue{background:#0ea5e9}
.insight-item .tag.purple{background:#8b5cf6}
.insight-item .tag.green{background:#22c55e}
.insight-item .tag.orange{background:#f97316}
.insight-item .tag.red{background:#ef4444}
.insight-item strong{color:#0f172a}
.opportunity-highlight{padding:14px 16px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fb923c;border-radius:12px;margin-top:12px}
.opportunity-highlight .oh-title{font-size:14px;font-weight:700;color:#9a3412;margin-bottom:6px}
.opportunity-highlight .oh-text{font-size:13px;color:#7c2d12;line-height:1.6}
@media(max-width:768px){
.stats-grid{grid-template-columns:1fr}
.competitor-grid{grid-template-columns:1fr}
.detail-grid{grid-template-columns:1fr}
.header h1{font-size:18px}
.stat-value{font-size:22px}
.data-table{font-size:12px}
.data-table thead th,.data-table tbody td{padding:8px 10px}
#insightSection{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
<h1>竞品分析周报系统</h1>
<button class="btn-primary" onclick="generateReport()">生成周报</button>
</div>

<div class="container">
<div id="dashboard" class="view active">
<div class="stats-grid">
<div class="stat-card" onclick="showStatDetail('reviews')">
<div class="stat-label">本周评论数 <span class="go-icon">›</span></div>
<div class="stat-value">35,570<span class="unit">条</span></div>
</div>
<div class="stat-card" onclick="showStatDetail('reports')">
<div class="stat-label">累计周报 <span class="go-icon">›</span></div>
<div class="stat-value">24<span class="unit">份</span></div>
</div>
<div class="stat-card" onclick="showStatDetail('painpoints')">
<div class="stat-label">发现痛点 <span class="go-icon">›</span></div>
<div class="stat-value">42<span class="unit">个</span></div>
</div>
</div>

<div id="insightSection" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px"></div>

<div class="weekly-overview">
<div class="section-title">本周概览</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div>
<div style="font-size:13px;color:#64748b;margin-bottom:8px;font-weight:500">各竞品正面评价占比</div>
<div class="chart-container" style="height:220px"><canvas id="barChart"></canvas></div>
</div>
<div>
<div style="font-size:13px;color:#64748b;margin-bottom:8px;font-weight:500">关键痛点</div>
<div class="pain-points-list" id="painPointsList"></div>
</div>
</div>
<div id="competitorTags" style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px"></div>
</div>

<div class="section-title">历史周报</div>
<div class="reports-list" id="reportsList"></div>
</div>

<div id="competitorDetail" class="view">
<button class="back-btn" onclick="showView('dashboard')">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
返回总览
</button>
<div class="detail-header" id="detailHeader"></div>
<div class="detail-grid" id="detailGrid"></div>
</div>

<div id="statDetail" class="view">
<button class="back-btn" onclick="showView('dashboard')">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
返回总览
</button>
<div id="statDetailContent"></div>
</div>

<div id="reportDetail" class="view">
<button class="back-btn" onclick="showView('dashboard')">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
返回总览
</button>
<div id="reportDetailContent"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var platforms=['App Store','华为应用市场','小米应用商店','OPPO软件商店','vivo应用商店','应用宝','豌豆荚'];
var sentimentLabels={positive:'正面',neutral:'中性',negative:'负面'};

function randomDate(start,end){
return new Date(start.getTime()+Math.random()*(end.getTime()-start.getTime()));
}
function formatDate(d){
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function randomPlatform(){
return platforms[Math.floor(Math.random()*platforms.length)];
}

var allReviews=[];
var reviewTexts={
ths:{
positive:['数据更新很快，专业度很高','AI选股功能确实有用','自选股管理很方便','行情推送及时','技术指标很全面','Level-2数据免费开放太好了','K线图分析功能强大','选股器功能越来越好了','资讯推送很及时','基金筛选功能不错'],
neutral:['功能很全面，但广告真的太多了','AI选股功能不错，但经常卡顿','界面信息密度太高，新手不太友好','自选股分组功能可以再优化','行情页面加载有点慢','资讯推送可以更精准一些','社区讨论质量参差不齐','条件单功能还需要完善','画线工具可以更丰富','模拟交易功能比较基础'],
negative:['广告弹窗太多了，严重影响使用','卡顿严重，行情刷新时经常无响应','推送消息太频繁，关都关不掉','更新后更卡了，还多了很多没用的功能','VIP功能太贵了，性价比不高','行情数据偶尔有延迟','登录经常需要验证，很烦','夜间模式适配不好','内存占用太高了','闪退问题频繁']
},
dfcf:{
positive:['资讯更新速度行业领先','股吧社区很活跃','基金数据很全面','开户优惠力度大','行情数据稳定','研报内容质量高','ETF筛选工具好用','组合跟踪功能实用','直播课程很有价值','交易体验流畅'],
neutral:['资讯很丰富，但社区里水帖太多了','开户流程需要优化','行情页面广告位太多','基金筛选条件不够灵活','资讯推送可以更精准','社区管理需要加强','部分功能入口不好找','自选股同步偶尔出问题','交易手续费偏高','模拟盘功能比较基础'],
negative:['开户流程太复杂了，搞了半小时才弄好','股吧广告和无意义内容太多','APP体积太大，占用存储','推送通知关不掉','行情刷新有延迟','客服回复太慢','VIP功能性价比不高','界面太复杂，操作繁琐','数据导出功能不好用','视频广告强制播放']
},

neutral:['很多功能入口藏得太深，不好找','部分高级功能需要额外开通','自选股管理可以更灵活','行情页面信息密度可以更高','资讯更新频率可以加快','模拟交易功能比较简单','社区互动功能较弱','缺少量化回测工具','基金筛选功能一般','夜间模式不够完善'],
negative:['行情偶尔有延迟','APP启动速度偏慢','部分功能闪退','交易确认弹窗太多','缺少网格交易功能','自选股数量限制太少','推送通知设置不灵活','K线指标不够丰富','没有Level-2数据','账户分析功能太简单']
},
hbzt:{
positive:['网格策略很好用','条件单升级后好用多了','交易手续费低','ETF品种覆盖全','智能提醒功能实用','策略回测功能不错','界面简洁易上手','下单速度快','风控功能完善','客服响应及时'],

negative:['行情延迟严重，做短线很受影响','APP经常闪退','功能太少了，和头部差距大','没有Level-2行情','资讯更新太慢','自选股同步经常失败','交易品种不够丰富','缺少智能选股功能','界面设计过时','推送通知不及时']

function generateReviews(){
var now=new Date(2026,5,3);
var oneMonthAgo=new Date(2026,4,3);
var id=0;
var compKeys=['ths','dfcf','zlcf','hbzt'];
compKeys.forEach(function(key){
var texts=reviewTexts[key];
var counts={positive:Math.floor(8+Math.random()*5),neutral:Math.floor(6+Math.random()*4),negative:Math.floor(4+Math.random()*4)};

function renderPagination(totalPages){
if(totalPages<=1)return '';
var html='<div class="pagination">';
html+='<button onclick="goStatPage('+(currentStatPage-1)+')" '+(currentStatPage<=1?'disabled':'')+'>上一页</button>';
var startPage=Math.max(1,currentStatPage-2);
var endPage=Math.min(totalPages,currentStatPage+2);
if(startPage>1){
html+='<button onclick="goStatPage(1)">1</button>';
if(startPage>2)html+='<span class="page-info">...</span>';
}
for(var i=startPage;i<=endPage;i++){
html+='<button onclick="goStatPage('+i+')" '+(i===currentStatPage?'class="active"':'')+'>'+i+'</button>';
}
if(endPage<totalPages){
if(endPage<totalPages-1)html+='<span class="page-info">...</span>';
html+='<button onclick="goStatPage('+totalPages+')">'+totalPages+'</button>';
}
html+='<button onclick="goStatPage('+(currentStatPage+1)+')" '+(currentStatPage>=totalPages?'disabled':'')+'>下一页</button>';
html+='</div>';
return html;
}

function goStatPage(page){
currentStatPage=page;
renderStatDetail();
window.scrollTo({top:0,behavior:'smooth'});
}

function showReportDetail(id){
var r=reportContents[id];
if(!r){
showToast('该周报内容暂未录入');
return;
}
var content=document.getElementById('reportDetailContent');
content.innerHTML='<div class="report-actions"><button class="btn-action btn-copy" onclick="copyReport('+id+')">复制内容</button><button class="btn-action btn-download" onclick="downloadReport('+id+')">下载周报</button></div><div class="report-detail-content">'+r.body+'</div>';
showView('reportDetail');
}

function copyReport(id){
var r=reportContents[id];
var temp=document.createElement('div');
temp.innerHTML=r.body;
var text=temp.innerText;
navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板')}).catch(function(){showToast('复制失败，请手动复制')});
}

function downloadReport(id){
var r=reportContents[id];
var temp=document.createElement('div');
temp.innerHTML=r.body;
var text=temp.innerText;
var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download=r.title+'.txt';
a.click();
URL.revokeObjectURL(url);
showToast('周报已下载');
}

function generateReport(){
showToast('周报生成中，请稍候...');
setTimeout(function(){showToast('周报生成完成！')},1500);
}

function showToast(msg){
var toast=document.getElementById('toast');
toast.textContent=msg;
toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show')},2500);
}

renderCompetitorTags();
renderPainPoints();
renderReports();
renderBarChart();
renderInsightSection();
